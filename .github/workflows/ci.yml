name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Informational for now (the tree has pre-existing style lints); tighten
      # to `-- -D warnings` once they are cleared with `cargo clippy --fix`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      # No `--features stealth`: tests don't need the BoringSSL/TLS-impersonation
      # path, and it keeps CI off the fragile boring-sys build.
      # `--locked` enforces the committed Cargo.lock (SUPPLY-02): a build must use
      # the audited dependency set, not silently resolve to newer versions.
      - name: Test
        run: cargo test --workspace --locked

  stealth:
    name: Build & test (stealth / wreq)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # boring-sys (BoringSSL) runs bindgen, which needs libclang. Without it the
      # `--features stealth` build fails — which is why this path was previously
      # untested (the maintainers' Windows hosts lack libclang). Run it on Linux
      # so the stealth wreq client (SSRF re-validation, body-size pre-check) and
      # the browser stealth wiring are actually compiled and exercised.
      - name: Install libclang (BoringSSL bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Test obscura-net (stealth)
        run: cargo test -p obscura-net --features stealth --locked
      - name: Build stealth surfaces
        run: cargo build -p obscura-browser --features stealth --locked

  advisories:
    name: Audit & Deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # DENY-NO-LICENSES-N4: also enforce the deny.toml [licenses] allow-list
          # so a transitive dep under a copyleft / unknown license is caught.
          command: check advisories bans sources licenses

  semgrep:
    name: Semgrep (Rust SAST)
    runs-on: ubuntu-22.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff-aware baseline scan below can reach the PR
          # base commit.
          fetch-depth: 0
      # SEMGREP-NEUTERED-N3: the scan used to carry `continue-on-error: true`, so
      # `--error` was a no-op and a real finding never failed CI. Gate NEW findings
      # instead: on a PR, diff against the base commit so the experimental-Rust
      # ruleset's pre-existing noise doesn't block merges, but a newly introduced
      # finding fails the job. On push (no PR base) it stays informational.
      - name: Semgrep scan (new findings fail)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            semgrep scan --config p/rust --error \
              --baseline-commit "${{ github.event.pull_request.base.sha }}"
          else
            semgrep scan --config p/rust --error || true
          fi
